name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's ubuntu runners already include the Android SDK. Just accept the licenses so
      # Gradle can auto-download any missing platform / build-tools.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      # The repo has no gradlew / wrapper jar, so install the exact Gradle version from gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # app/build.gradle.kts signs debug builds with ${rootDir}/debug.keystore. A fresh keystore
      # on every run would sign each APK with a different key, so "App not installed as package
      # conflicts with an existing package" happens whenever someone updates over a previous
      # build. ci/debug.keystore.b64 is the SAME committed keystore every run.
      - name: Restore stable debug keystore
        run: base64 -d ci/debug.keystore.b64 > debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Pushing a tag like v1.0.1 publishes the APK as a GitHub Release,
      # which is what the in-app Updates screen checks.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
